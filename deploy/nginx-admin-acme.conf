server {
    listen 80;
    listen [::]:80;
    server_name admin.mysuperhero.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        root /var/www/superheroo-admin/current;
        try_files $uri $uri/ /index.html;
    }
}
